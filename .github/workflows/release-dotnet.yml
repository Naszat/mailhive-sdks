name: release-dotnet

# Publishes `Mailhive` to NuGet when a dotnet-v* tag is pushed from main,
# through NuGet trusted publishing (OIDC): no long-lived API key is stored.
# One-time setup on nuget.org:
#   1. Under your account → Trusted Publishing, add a policy for repository
#      owner Naszat, repository mailhive-sdks, workflow release-dotnet.yml,
#      environment nuget.
#   2. Store the nuget.org user name (profile name, not email) that owns the
#      policy as the repository secret NUGET_USER, in the `nuget` environment.
#   3. Reserve the `Mailhive` package ID prefix for the owning account
#      (request it from NuGet support: https://learn.microsoft.com/nuget/nuget-org/id-prefix-reservation).

on:
  push:
    tags: ["dotnet-v*"]

permissions:
  contents: read
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # runs the shared mock server
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tag matches the package version
        run: |
          version="$(grep -oP '(?<=<Version>)[^<]+' src/Mailhive/Mailhive.csproj)"
          test "dotnet-v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} doesn't match version ${version}"; exit 1; }
      - run: dotnet test -c Release
      - run: dotnet pack src/Mailhive/Mailhive.csproj -c Release -o artifacts
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
