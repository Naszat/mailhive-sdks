name: ruby

on:
  push:
    branches: [develop, main]
    paths: ["ruby/**", "spec/**", "mock-server/**", ".github/workflows/ruby.yml"]
  pull_request:
    paths: ["ruby/**", "spec/**", "mock-server/**", ".github/workflows/ruby.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4"]
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # runs the shared mock server
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: ruby
          bundler-cache: true
      - run: bundle exec rake test
      - run: gem build mailhive.gemspec
