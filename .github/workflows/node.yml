name: node

on:
  push:
    branches: [develop, main]
    paths: ["node/**", "spec/**", "mock-server/**", ".github/workflows/node.yml"]
  pull_request:
    paths: ["node/**", "spec/**", "mock-server/**", ".github/workflows/node.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
