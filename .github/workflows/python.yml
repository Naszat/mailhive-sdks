name: python

on:
  push:
    branches: [develop, main]
    paths: ["python/**", "spec/**", "mock-server/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "spec/**", "mock-server/**", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest (26.04) no longer ships Python 3.9; pin the image while 3.9 is supported.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # runs the shared mock server
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[django]' pytest build
      - run: pytest -q
      - run: python -m build
