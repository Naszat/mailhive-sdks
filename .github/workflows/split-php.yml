name: split-php

# Packagist reads composer.json from a repository's root, so php/ is mirrored
# to the read-only repository Naszat/mailhive-php. Pushing a php-v1.2.3 tag
# on main publishes v1.2.3 there, and Packagist picks it up.
#
# One-time setup:
#   1. The public repository Naszat/mailhive-php exists (created 2026-09-29).
#   2. Deploy keys are switched off for the Naszat organization, so either
#      allow them (Organization settings → Repository → Deploy keys), add one
#      with write access to mailhive-php and store its private key here as
#      PHP_MIRROR_DEPLOY_KEY; or leave the secret unset and mirror by hand
#      (see php/README.md's "Releasing"). Without the secret this job skips.
#   3. Submit https://github.com/Naszat/mailhive-php on packagist.org (vendor
#      "mailhive") and enable its GitHub hook.

on:
  push:
    branches: [main]
    paths: ["php/**"]
    tags: ["php-v*"]

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.PHP_MIRROR_DEPLOY_KEY != '' }}
    steps:
      - name: Skip without a deploy key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::PHP_MIRROR_DEPLOY_KEY isn't set, so php/ wasn't mirrored. Mirror it by hand (php/README.md)."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
      - uses: webfactory/ssh-agent@v0.9.0
        if: env.HAS_KEY == 'true'
        with:
          ssh-private-key: ${{ secrets.PHP_MIRROR_DEPLOY_KEY }}
      - name: Split php/ and push to the mirror
        if: env.HAS_KEY == 'true'
        run: |
          git subtree split --prefix php -b php-split
          git push git@github.com:Naszat/mailhive-php.git php-split:main --force
          if [[ "${GITHUB_REF}" == refs/tags/php-v* ]]; then
            version="${GITHUB_REF_NAME#php-}"
            test "$version" = "v$(sed -n "s/.*VERSION = '\(.*\)';/\1/p" php/src/Mailhive.php)"
            git tag "$version" php-split
            git push git@github.com:Naszat/mailhive-php.git "$version"
          fi
