name: client

on:
  push:
    branches: [develop, main]
    paths: ["client/**", "spec/**", "mock-server/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["client/**", "spec/**", "mock-server/**", ".github/workflows/client.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
